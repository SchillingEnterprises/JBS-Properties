name: .NET Framework CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbs-dotnet-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contracts:
    name: Verify controller access-control guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
      - name: Run controller security contract tests
        run: python -m unittest discover -s tests -v

  build:
    name: Restore and build (.NET Framework 4.8)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Restore NuGet packages, including .NET Framework reference assemblies
        shell: pwsh
        run: nuget restore .\JBS_Properties.sln -NonInteractive

      - name: Verify .NET Framework reference assemblies were restored
        shell: pwsh
        run: |
          $referenceTargets = "packages\\Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3\\build\\Microsoft.NETFramework.ReferenceAssemblies.net48.targets"
          if (-not (Test-Path $referenceTargets)) {
            throw "The .NET Framework 4.8 reference-assemblies target file was not restored."
          }

      - name: Create compatibility path for legacy NuGet imports
        shell: pwsh
        run: |
          $solutionPackages = (Resolve-Path ".\packages").Path
          $parentPackages = Join-Path (Split-Path (Get-Location).Path -Parent) "packages"
          if (Test-Path $parentPackages) {
            $existingItem = Get-Item -LiteralPath $parentPackages -Force
            if (($existingItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw "The legacy package path exists but is not a directory junction."
            }
          } else {
            New-Item -ItemType Junction -Path $parentPackages -Target $solutionPackages | Out-Null
          }
          $sentinel = Join-Path $parentPackages "Antlr.3.5.0.2\lib\Antlr3.Runtime.dll"
          if (-not (Test-Path -LiteralPath $sentinel)) {
            throw "The legacy package path cannot access restored solution packages."
          }

      - name: Build solution in Release configuration
        shell: pwsh
        run: msbuild .\JBS_Properties.sln /m /p:Configuration=Release /p:ContinuousIntegrationBuild=true /verbosity:minimal

      # No test project is currently present. This build gate intentionally
      # does not claim that the application has unit-test coverage.
