name: .NET Framework CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbs-dotnet-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build (.NET Framework 4.6.1)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Restore NuGet packages, including .NET Framework reference assemblies
        shell: pwsh
        run: nuget restore .\JBS_Properties.sln -NonInteractive

      - name: Verify .NET Framework reference assemblies were restored
        shell: pwsh
        run: |
          $referenceTargets = "packages\\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\\build\\Microsoft.NETFramework.ReferenceAssemblies.net461.targets"
          if (-not (Test-Path $referenceTargets)) {
            throw "The .NET Framework 4.6.1 reference-assemblies target file was not restored."
          }

      - name: Build solution in Release configuration
        shell: pwsh
        run: msbuild .\JBS_Properties.sln /m /p:Configuration=Release /p:ContinuousIntegrationBuild=true /verbosity:minimal

      # No test project is currently present. This build gate intentionally
      # does not claim that the application has unit-test coverage.
