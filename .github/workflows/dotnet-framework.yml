name: .NET Framework CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build (.NET Framework 4.6.1)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\JBS_Properties.sln -NonInteractive

      - name: Build solution
        shell: pwsh
        run: msbuild .\JBS_Properties.sln /m /p:Configuration=Release /p:ContinuousIntegrationBuild=true /verbosity:minimal

      # No dedicated test project was present in the repository audit.
      # Add a test project before introducing a test command here; do not
      # report a build-only run as a passing unit-test suite.
